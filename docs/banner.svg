<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Xbox Dashboard for Steam Deck">
  <defs>
    <radialGradient id="glow" cx="18%" cy="-10%" r="95%">
      <stop offset="0" stop-color="#1f8f1f"/>
      <stop offset="0.38" stop-color="#0c3a0c"/>
      <stop offset="0.8" stop-color="#080808"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2f2f"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- tab bar -->
  <g font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-weight="600" font-size="17">
    <rect x="64" y="34" width="34" height="22" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="81" y="50" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">LB</text>
    <text x="114" y="51" fill="#ffffff">Home</text>
    <rect x="114" y="60" width="48" height="3" fill="#107C10"/>
    <text x="184" y="51" fill="#ffffff" fill-opacity="0.6">My games &amp; apps</text>
    <text x="354" y="51" fill="#ffffff" fill-opacity="0.6">Store</text>
    <text x="420" y="51" fill="#ffffff" fill-opacity="0.6">Community</text>
    <text x="536" y="51" fill="#ffffff" fill-opacity="0.6">System</text>
    <rect x="612" y="34" width="34" height="22" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.55"/>
    <text x="629" y="50" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">RB</text>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Noto Sans, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="150" font-size="60" font-weight="700">Xbox Dashboard</text>
    <text x="66" y="192" font-size="24" fill-opacity="0.8">the Xbox Series X|S look for Steam Deck Game Mode</text>
  </g>

  <!-- tile row -->
  <g>
    <rect x="64" y="226" width="78" height="78" rx="6" fill="url(#tile)" stroke="#000" stroke-width="2"/>
    <rect x="61" y="223" width="84" height="84" rx="8" fill="none" stroke="#ffffff" stroke-width="3"/>
    <rect x="156" y="236" width="62" height="62" rx="6" fill="url(#tile)"/>
    <rect x="228" y="236" width="62" height="62" rx="6" fill="url(#tile)"/>
    <rect x="300" y="236" width="62" height="62" rx="6" fill="url(#tile)"/>
    <rect x="372" y="236" width="62" height="62" rx="6" fill="url(#tile)"/>
    <rect x="444" y="236" width="62" height="62" rx="6" fill="#107C10"/>
    <g fill="#ffffff" fill-opacity="0.9">
      <rect x="456" y="248" width="6" height="22" rx="1"/>
      <rect x="466" y="248" width="6" height="22" rx="1"/>
      <rect x="477" y="249" width="6" height="22" rx="1" transform="rotate(-14 480 260)"/>
    </g>
  </g>

  <!-- right side cards -->
  <g opacity="0.95">
    <rect x="860" y="96" width="176" height="88" rx="8" fill="#107C10"/>
    <rect x="1050" y="96" width="176" height="88" rx="8" fill="#2a2a2a"/>
    <rect x="860" y="198" width="176" height="88" rx="8" fill="#2a2a2a"/>
    <rect x="1050" y="198" width="176" height="88" rx="8" fill="#2a2a2a" stroke="#ffffff" stroke-width="3"/>
    <g font-family="Segoe UI, Noto Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#fff">
      <text x="876" y="168">Settings</text>
      <text x="1066" y="168">Captures</text>
      <text x="876" y="270">Quick Access</text>
      <text x="1066" y="270">Power</text>
    </g>
  </g>
</svg>

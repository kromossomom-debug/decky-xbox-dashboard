name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: python3 -m py_compile main.py py_modules/*.py
      - run: scripts/package.sh xbox-dashboard.zip

      - uses: actions/upload-artifact@v4
        with:
          name: xbox-dashboard
          path: xbox-dashboard.zip

      # Pushing a tag like v0.0.6-alpha publishes a release with the ZIP attached. The notes come
      # from that version's CHANGELOG.md section (GitHub's commit list if there isn't one).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *alpha* || "$TAG" == *beta* ]]; then prerelease="--prerelease"; fi
          if python3 scripts/release-notes.py "$TAG" > notes.md; then
            notes=(--notes-file notes.md)
          else
            echo "::warning::CHANGELOG.md has no section for $TAG"
            notes=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" xbox-dashboard.zip --clobber
            if [[ "${notes[0]}" == "--notes-file" ]]; then gh release edit "$TAG" --notes-file notes.md; fi
          else
            gh release create "$TAG" xbox-dashboard.zip --title "Xbox Dashboard $TAG" "${notes[@]}" $prerelease
          fi
